ga4_analytics:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth            # gcloud auth application-default login
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: ga4
      location: US             # the public GA4 sample lives in US
      threads: 4
      priority: interactive
      job_execution_timeout_seconds: 600
