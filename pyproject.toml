[project]
name = "ablab"
version = "1.0.0"
description = "Product analytics on the GA4 ecommerce sample (BigQuery + dbt) and an A/B testing toolkit validated by simulation and applied to a real 14M-user randomised experiment."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Anurag Bhandary" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "duckdb>=1.1",
    "pyarrow>=17",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
# Talking to BigQuery: building the dbt models and exporting the marts.
bigquery = [
    "dbt-core>=1.9",
    "dbt-bigquery>=1.9",
    "google-cloud-bigquery>=3.25",
]

[project.scripts]
ablab = "ablab.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "sqlfluff>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ablab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["ablab"]
omit = ["*/ablab/__main__.py"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
files = ["src"]
python_version = "3.12"
strict = true
ignore_missing_imports = true
